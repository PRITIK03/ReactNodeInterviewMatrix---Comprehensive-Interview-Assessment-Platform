name: Verify InterviewMatrix
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: matrix
          POSTGRES_PASSWORD: ${{ github.run_id }}-ci
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U matrix" --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: npm run check:repo && npm run test:repo-safety
      - run: |
          python -m pip install --require-hashes -r deploy/requirements.lock
          python -m pip install -r backend/requirements-test.txt ruff pip-audit
          ruff check --select E9,F63,F7,F82 backend runner tests scripts/*.py
          python -m compileall -q backend runner
          python -c "from backend.main import app; assert '/api/v1/evaluations/{eid}' in app.openapi()['paths']"
          pip-audit --no-deps --disable-pip -r deploy/requirements.lock
          python scripts/fetch-guest.py
          sudo apt-get update && sudo apt-get install -y tesseract-ocr-eng tesseract-ocr
      - name: Exercise native WASI host with synthetic input
        run: |
          echo '{"source":"print(7)","stdin":""}' | python -I runner/guest.py
          echo '{"source":"while True: pass","stdin":""}' | python -I runner/guest.py
      - run: python -m pytest -q tests
      - run: python -m pytest -q tests
        env:
          MATRIX_TEST_POSTGRES: postgresql:///postgres
          PGHOST: localhost
          PGUSER: matrix
          PGPASSWORD: ${{ github.run_id }}-ci
      - working-directory: frontend/my-react-app
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run lint
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify images and private service connectivity
        shell: bash
        env:
          CLAMD_HOST: scanner.invalid
          S3_ENDPOINT: https://storage.invalid
          S3_BUCKET: ci-private
          AWS_ACCESS_KEY_ID: ci-placeholder
          AWS_SECRET_ACCESS_KEY: ci-placeholder
        run: |
          set -euo pipefail
          export MATRIX_RUNNER_TOKEN="$(openssl rand -hex 32)" MATRIX_PG_PASSWORD="$(openssl rand -hex 32)"
          docker compose config --quiet
          trap 'docker compose down -v' EXIT
          docker compose build
          docker compose up -d --wait --wait-timeout 150
          curl --fail --retry 5 http://localhost:8080/api/health
          docker compose exec -T api python -c 'from backend.execution import run_case; assert run_case("print(7)", "")["stdout"].strip()=="7"'
